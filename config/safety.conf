# Safety limits (enforced by lib/safety.sh and lib/rate_limit.sh)

UASF_SAFETY_MAX_RPS=20
UASF_SAFETY_MAX_TIMEOUT=120
UASF_SAFETY_MAX_STEP_REPEAT=50

# Lab-only: max requests for rate-limit probe module (never unbounded)
UASF_RATE_LIMIT_PROBE_MAX_REQUESTS_LAB=25

# Hosts that are always rejected unless --lab-mode
UASF_FORBIDDEN_HOST_REGEX='^(169\.254\.169\.254|metadata\.google\.internal|fd00:ec2::254)$'

# Require explicit acknowledgement for non-localhost targets
UASF_REQUIRE_ACK_NONLOCAL=1
