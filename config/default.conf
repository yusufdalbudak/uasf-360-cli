# UASF 360 CLI — default runtime (override via env or init copies)

# Maximum response body bytes stored in evidence samples
UASF_MAX_BODY_BYTES=8192

# Default HTTP client behavior
UASF_DEFAULT_RPS=2
UASF_DEFAULT_TIMEOUT=10
UASF_DEFAULT_CONCURRENCY=1

# Correlation header value prefix (full id is prefix-timestamp-random)
UASF_CORRELATION_PREFIX=UASF

# curl: 0 = do not follow redirects (scope safety), 1 = follow
UASF_HTTP_FOLLOW_REDIRECTS=0

# Connect timeout (seconds)
UASF_CONNECT_TIMEOUT=10

# Max download bytes per response (curl --max-filesize)
UASF_MAX_DOWNLOAD_BYTES=1048576

# WAF evasion tier for injection payloads: off | standard | lab (lab needs --lab-mode)
# Implicit default is chosen at run-time (usually off unless --lab-mode; see CLI help).
UASF_WAF_EVASION=off

# Lab: vt (https://github.com/HappyHackingSpace/vt) binary path override; unset = vt on PATH.
# UASF_VT_BIN=/usr/local/bin/vt

# Local OWASP Juice Shop (labs/juice-shop/docker-compose.yml)
UASF_JUICE_HOST=127.0.0.1
UASF_JUICE_PORT=3000
UASF_JUICE_WAIT_TIMEOUT=120
# UASF_JUICE_IMAGE=bkimminich/juice-shop:latest
